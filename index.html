<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAINEL DE CONTROLE - Euro Truck Simulator 2</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9800">
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: rgba(15, 17, 21, 0.92);
            /* Fundo do painel agora é preto sólido para garantir contraste */
            --panel-bg: #000000; 
            --accent-color: #ff9800;
            --accent-hover: #e68900;
            --text-color: #e6edf3;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --success-color: #2ea043;
            --danger-color: #f85149;
            --warning-color: #d29922;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            /* Mantenha sua imagem de fundo aqui */
            background-image: url('fundo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0f1115;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background-color: rgba(0,0,0,0.8); /* Header levemente transparente sobre a imagem */
            border-bottom: 2px solid var(--accent-color);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 14px;
            font-weight: 700;
        }

        .btn-logout {
            background: rgba(248, 81, 73, 0.15);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 12px;
            padding-bottom: 40px;
        }

        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding: 15px;
        }

        .login-card {
            background-color: var(--panel-bg); /* Fundo preto sólido definido no :root */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px; /* Aumentei um pouco o padding interno */
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); /* Sombra mais forte para destacar o cartão */
            text-align: center;
        }

        .login-card h2 {
            margin-top: 0;
            /* Aumentei o espaçamento abaixo do título e ícone */
            margin-bottom: 25px; 
            color: var(--accent-color);
            font-size: 20px; /* Título ligeiramente maior */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-card h2 i {
            font-size: 24px;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 15px;
            width: 100%;
        }

        .nav-tabs button {
            background-color: rgba(255,255,255,0.05);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 4px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            text-align: center;
        }

        .nav-tabs button i {
            color: var(--accent-color);
            font-size: 13px;
        }

        .nav-tabs button.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .nav-tabs button.active i { color: #000; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 15px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .card h3 i { color: var(--accent-color); }

        .form-group { margin-bottom: 15px; text-align: left; }

        label {
            display: block;
            margin-bottom: 8px; /* Espaçamento entre o label e o input */
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.1); /* Input levemente destacado sobre o fundo preto */
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        
        /* Cor do texto digitado na senha alterada para branco */
        input[type="password"] {
            color: #ffffff;
            font-family: monospace; /* Deixa os pontinhos da senha mais alinhados */
            letter-spacing: 2px;
        }

        input:focus, select:focus { border-color: var(--accent-color); box-shadow: 0 0 0 2px rgba(255, 152, 0, 0.2); }

        button.btn-submit {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        button.btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            text-decoration: underline;
            width: 100%;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .metric-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .metric-icon {
            width: 32px;
            height: 32px;
            background-color: rgba(255, 152, 0, 0.1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--accent-color);
        }

        .metric-info h3 {
            margin: 0;
            font-size: 11px;
            color: var(--text-muted);
            border: none;
            padding: 0;
        }

        .metric-info p {
            margin: 2px 0 0 0;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-color);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            max-height: 350px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
            min-width: 320px;
        }

        th, td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background-color: rgba(13, 17, 23, 0.9);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .empty-row {
            text-align: center;
            color: var(--text-muted);
            padding: 15px;
        }

        #toast {
            visibility: hidden;
            min-width: 220px;
            background-color: var(--success-color);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            transform: translateX(-50%);
            bottom: 20px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: visibility 0.2s, opacity 0.2s ease-in-out;
            opacity: 0;
        }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <header id="main-header" style="display: none;">
        <h1 id="header-title">PAINEL - ETS2</h1>
        <button class="btn-logout" onclick="fazerLogout()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </header>

    <div class="container">
        
        <!-- TELA DE LOGIN / CADASTRO -->
        <div id="login-screen">
            <div class="login-card">
                <!-- Título e ícone com espaçamento ajustado no CSS (.login-card h2) -->
                <h2><i class="fa-solid fa-truck-fast"></i> ETS2 Gestão</h2>
                
                <!-- FORMULÁRIO DE LOGIN -->
                <div id="form-login-div">
                    <div class="form-group">
                        <label>Tipo de Acesso</label>
                        <select id="tipo-acceso" onchange="mudarTipoAcesso()">
                            <option value="patrao">Patrão (Ieda Daltro)</option>
                            <option value="motorista">Motorista (Funcionário)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Usuário</label>
                        <input type="text" id="login-usuario" placeholder="Ieda Daltro">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="login-senha" placeholder="Sua senha">
                    </div>

                    <button class="btn-submit" onclick="entrarNoSistema()">Entrar no Sistema</button>
                    <button class="btn-link" onclick="alternarTelaCadastro(true)">Sou novo motorista? Cadastre-se aqui</button>
                </div>

                <!-- FORMULÁRIO DE AUTO-CADASTRO DO MOTORISTA -->
                <div id="form-cadastro-div" style="display: none;">
                    <div class="form-group">
                        <label>Nome / Apelido</label>
                        <input type="text" id="cad-nome" placeholder="Seu nome completo ou apelido">
                    </div>
                    <div class="form-group">
                        <label>Crie seu Usuário de Login</label>
                        <input type="text" id="cad-usuario" placeholder="Ex: jeferson123">
                    </div>
                    <div class="form-group">
                        <label>Crie sua Senha</label>
                        <input type="password" id="cad-senha" placeholder="Sua senha">
                    </div>

                    <button class="btn-submit" onclick="motoristaAutoCadastrar()">Concluir Cadastro e Entrar</button>
                    <button class="btn-link" onclick="alternarTelaCadastro(false)">Já tenho conta? Voltar ao Login</button>
                </div>
            </div>
        </div>

        <!-- PAINEL DO PATRÃO -->
        <div id="painel-patrao" style="display: none;">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'p-visao')"><i class="fa-solid fa-chart-pie"></i> Visão</button>
                <button class="tab-btn" onclick="switchTab(event, 'p-motoristas')"><i class="fa-
