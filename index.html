<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIÁRIO DE BORDO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    h1 { color: #1a365d; margin-bottom: 20px; font-size: 24px; }
    h2 { color: #2b6cb0; margin-bottom: 15px; font-size: 20px; }
    
    .type-selector { display: flex; gap: 10px; margin-bottom: 15px; }
    .type-btn { flex: 1; padding: 10px; border: 1px solid #cbd5e0; background: #edf2f7; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .type-btn.active { background: #3182ce; color: white; border-color: #3182ce; }
    
    input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #cbd5e0; border-radius: 4px; }
    button.btn-main { width: 100%; padding: 12px; background: #2b6cb0; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button.btn-main:hover { background: #2c5282; }
    
    .link-signup { margin-top: 15px; display: block; color: #3182ce; text-decoration: none; font-size: 14px; }
    
    /* Layout Área Empresa */
    .dashboard { display: none; width: 100%; max-width: 800px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .nav-menu { display: flex; gap: 10px; margin-top: 20px; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }
    .nav-btn { padding: 10px 15px; background: none; border: none; font-weight: bold; color: #4a5568; cursor: pointer; }
    .nav-btn.active { color: #3182ce; border-bottom: 2px solid #3182ce; }
    .tab-content { padding: 20px 0; text-align: left; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="card">
    <h1>DIÁRIO DE BORDO</h1>
    
    <div class="type-selector">
      <button class="type-btn active" id="btn-empresa" onclick="selectType('empresa')">Empresa</button>
      <button class="type-btn" id="btn-funcionario" onclick="selectType('funcionario')">Funcionários</button>
    </div>

    <form onsubmit="handleLogin(event)">
      <input type="text" placeholder="Login / Usuário" required>
      <input type="password" placeholder="Senha" required>
      <button type="submit" class="btn-main">Entrar</button>
    </form>

    <a href="#" class="link-signup" onclick="alert('Redirecionando para a tela de cadastro...')">Sou novo? Inscreva-se</a>
  </div>

  <!-- ÁREA DA EMPRESA -->
  <div id="company-screen" class="dashboard">
    <h1>J&Itransportes</h1>

    <div class="nav-menu">
      <button class="nav-btn active" onclick="switchTab('visao-geral', this)">Visão Geral</button>
      <button class="nav-btn" onclick="switchTab('status-viagem', this)">Status de Viagem</button>
      <button class="nav-btn" onclick="switchTab('viagens-cadastradas', this)">Viagens Cadastradas</button>
    </div>

    <div id="visao-geral" class="tab-content">
      <h2>Visão Geral</h2>
      <p>Resumo dos indicadores, veículos em rota e alertas da frota.</p>
    </div>

    <div id="status-viagem" class="tab-content hidden">
      <h2>Status de Viagem</h2>
      <p>Acompanhamento em tempo real das rotas ativas.</p>
    </div>

    <div id="viagens-cadastradas" class="tab-content hidden">
      <h2>Viagens Cadastradas</h2>
      <p>Histórico e listagem de viagens registradas no sistema.</p>
    </div>

    <button onclick="logout()" style="margin-top: 20px; padding: 8px 16px; background: #e53e3e; color: white; border: none; border-radius: 4px; cursor: pointer;">Sair</button>
  </div>

  <script>
    let userType = 'empresa';

    function selectType(type) {
      userType = type;
      document.getElementById('btn-empresa').classList.toggle('active', type === 'empresa');
      document.getElementById('btn-funcionario').classList.toggle('active', type === 'funcionario');
    }

    function handleLogin(e) {
      e.preventDefault();
      if (userType === 'empresa') {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('company-screen').style.display = 'block';
      } else {
        alert('Área de funcionários em desenvolvimento.');
      }
    }

    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.remove('hidden');
      element.classList.add('active');
    }

    function logout() {
      document.getElementById('company-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'block';
    }
  </script>
</body>
</html>
